name: Deploy RivuLog Printer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out RivuLog printer bridge
        uses: actions/checkout@v4

      - name: Install Rust with WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Fetch printa-ble
        run: git clone --depth 1 https://github.com/cicloid/printable.git upstream

      - name: Build printa-ble WebAssembly package
        run: |
          cd upstream
          ./scripts/build-web.sh

      - name: Assemble static site
        run: |
          mkdir -p site/pkg
          cp -R upstream/web/pkg/. site/pkg/
          cp index.html app.js .nojekyll README.md site/
          cp upstream/LICENSE site/LICENSE-printable.txt
          find upstream -name 'OFL*.txt' -type f -exec cp {} site/ \; || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
